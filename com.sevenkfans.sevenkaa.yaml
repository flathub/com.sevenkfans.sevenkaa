app-id: com.sevenkfans.sevenkaa
runtime: org.freedesktop.Platform
runtime-version: 24.08
sdk: org.freedesktop.Sdk
command: 7kaa
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: enet
    sources:
      - type: archive
        sha256: 28603c895f9ed24a846478180ee72c7376b39b4bb1287b73877e5eae7d96b0dd
        url: https://github.com/lsalzman/enet/archive/v1.3.18.tar.gz
        x-checker-data:
          type: anitya
          project-id: 696
          url-template: https://github.com/lsalzman/enet/archive/v$version.tar.gz
      - type: script  # cf. https://github.com/lsalzman/enet/blob/master/README
        dest-filename: autogen.sh
        commands:
          - autoreconf -ifv

  - name: 7kaa
    buildsystem: autotools
    post-install:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - ln -s ${FLATPAK_DEST}/extra/7kaa-music/MUSIC ${FLATPAK_DEST}/share/7kaa/
      - install -Dm 644 7kaa.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm 644 7kaa.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm 644 7kaa.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: git
        url: https://git.code.sf.net/p/skfans/7kaa
        #tag: v2.15.7
        commit: 44ca8a4cd5bdddaf8e9c8e3927c4880a423f62ef
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: 7kaa.metainfo.xml
      - type: file
        path: 7kaa.desktop
      - type: file
        path: 7kaa.png
      - type: extra-data
        filename: 7kaa-music-2.15.zip
        url: https://www.7kfans.com/downloads/7kaa-music-2.15.zip
        sha256: b6bdcd2ca4c7f78b45b831d70f30e3c472646e84dd8ca21e1f7128f80fcf0d32
        size: 25161791
      - type: script
        dest-filename: apply_extra
        commands:
          - unzip -q 7kaa-music-2.15.zip
          - rm 7kaa-music-2.15.zip
